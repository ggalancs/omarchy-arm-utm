# Runs the checks that can run without building a 3.6 GB image. Everything
# here has caught a real defect in this repository at least once, which is the
# bar for being in it: a check that has never failed is a check nobody has
# tested. Adapted from the workflow proposed by Fail-Safe in PR #6.
name: CI

# MANUAL ONLY. Never push/pull_request/schedule/tag.
#
# This workflow was added with `on: push` and ran twelve times on GitHub
# without the owner asking for it, four of them red in public. (This file used
# to say three runs and two failures; `gh run list` shows twelve push runs on
# 2026-09-03, four failed. scripts/ci-local.sh had the right numbers and this
# one did not, in the two files whose job is to justify the manual trigger from
# that history.) The rule already existed, written down in six other projects
# of his: CI on
# GitHub does not run without his explicit confirmation, every job is
# reproduced locally first, and only then is it triggered by hand.
#
# Verify locally with scripts/ci-local.sh, which runs exactly these steps.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          # Selected by SHEBANG, not by suffix: ten tracked shell programs have
          # no suffix at all -- the eight omarchy-arm-* commands that ship
          # inside the image, the update hook, and scripts/omssh -- so every
          # '*.sh' glob here skipped them. omssh had an unbalanced quote that
          # made it unparseable from the day it was written, through every
          # green run of this workflow.
          shell_files() {
            git ls-files | while IFS= read -r f; do
              case "$f" in *.sh) printf '%s\n' "$f"; continue ;; esac
              [ -f "$f" ] || continue
              head -1 "$f" 2>/dev/null | grep -qE '^#!.*[/ ](bash|sh)$' && printf '%s\n' "$f"
            done
          }
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(shell_files)
          exit $fail

      - name: Python syntax
        run: |
          set -euo pipefail
          # provision/src/omarchy-arm-vdagent has no .py suffix and is python.
          python_files() {
            git ls-files | while IFS= read -r f; do
              case "$f" in *.py) printf '%s\n' "$f"; continue ;; esac
              [ -f "$f" ] || continue
              head -1 "$f" 2>/dev/null | grep -qE '^#!.*python' && printf '%s\n' "$f"
            done
          }
          while IFS= read -r f; do python3 -m py_compile "$f"; done < <(python_files)

      # A comment between two backslash-continued lines is accepted by `bash -n`
      # and silently truncates the command. It cost a 40-minute build: the QEMU
      # invocation lost networking, the RNG and -nographic.
      - name: No comments inside continued commands
        run: |
          set -euo pipefail
          # Selected by SHEBANG, not by suffix: ten tracked shell programs have
          # no suffix at all -- the eight omarchy-arm-* commands that ship
          # inside the image, the update hook, and scripts/omssh -- so every
          # '*.sh' glob here skipped them. omssh had an unbalanced quote that
          # made it unparseable from the day it was written, through every
          # green run of this workflow.
          shell_files() {
            git ls-files | while IFS= read -r f; do
              case "$f" in *.sh) printf '%s\n' "$f"; continue ;; esac
              [ -f "$f" ] || continue
              head -1 "$f" 2>/dev/null | grep -qE '^#!.*[/ ](bash|sh)$' && printf '%s\n' "$f"
            done
          }
          python3 scripts/i18n-audit.py lint-cont $(shell_files)

      # The generated copies inside build-omarchy-arm.sh must match their
      # sources. When they drifted, the script shipped a README asserting things
      # that were no longer true.
      - name: Payloads match their sources
        run: python3 scripts/sync-payloads.py --check

      # Everything the code says and prints has to be in English. The word-list
      # version of this check reported zero while the build script printed 34
      # Spanish messages at whoever ran it.
      #
      # No dictionary is installed for this on purpose. It used to subtract
      # /usr/share/dict/words at runtime, and this workflow reported 15 Spanish
      # comments that a local run had cleared -- macOS ships a 235,976-entry
      # wordlist and Ubuntu ships about 100,000. The English exceptions are
      # committed in scripts/english-exceptions.txt instead, so the answer is
      # the same everywhere.
      - name: No Spanish in code, comments or output
        run: |
          set -euo pipefail
          # The self-test first: a global rename once walked into the
          # vocabulary and deleted two words from it, and every total after
          # that was measured with a detector that could not see them.
          python3 scripts/i18n-audit.py selftest
          # And the satisfiability pre-check's own assertions, which nothing
          # ran: the build invokes that script without --self-test, so its
          # eight classification cases had never executed anywhere.
          python3 scripts/check-alarm-satisfiable.py --self-test
          python3 scripts/i18n-audit.py audit       $(git ls-files)
          python3 scripts/i18n-audit.py strings     $(git ls-files)
          python3 scripts/i18n-audit.py identifiers $(git ls-files)
          python3 scripts/i18n-audit.py prose       $(git ls-files)

      # Three commands have been documented that did not exist: two renamed
      # flags left stale in the README, and one invented while writing the
      # paragraph that introduced it.
      # The contract check must run after everything it checks for is built.
      # Written in the wrong place it aborted a 26-minute build on a tool that
      # was about to be compiled, and nothing static would have shown it.
      - name: Unit tests
        run: |
          set -euo pipefail
          # expect, so that tests/test-expect-inactivity.sh actually runs. It
          # exits 77 ("skipped") without it, and this step runs under `set -e`,
          # so a skip would abort the whole job -- while a skip that did not
          # abort would be worse: a check nobody notices stopped running.
          sudo apt-get update -qq && sudo apt-get install -y -qq expect
          for t in tests/*.sh; do echo "::group::$t"; bash "$t"; echo "::endgroup::"; done

      # A published sha256 was corrupted by an update that ran a 16-character
      # substitution before the 64-character one, leaving half the new hash and
      # half the old. It read as plausible and pointed at nothing.
      - name: Published hash is coherent
        run: python3 scripts/check-published-hash.py

      - name: Documented flags exist
        run: python3 scripts/check-documented-flags.py

      - name: ShellCheck (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          set -euo pipefail
          # Selected by SHEBANG, not by suffix: ten tracked shell programs have
          # no suffix at all -- the eight omarchy-arm-* commands that ship
          # inside the image, the update hook, and scripts/omssh -- so every
          # '*.sh' glob here skipped them. omssh had an unbalanced quote that
          # made it unparseable from the day it was written, through every
          # green run of this workflow.
          shell_files() {
            git ls-files | while IFS= read -r f; do
              case "$f" in *.sh) printf '%s\n' "$f"; continue ;; esac
              [ -f "$f" ] || continue
              head -1 "$f" 2>/dev/null | grep -qE '^#!.*[/ ](bash|sh)$' && printf '%s\n' "$f"
            done
          }
          fail=0
          while IFS= read -r f; do
            shellcheck -S error -e SC1090,SC1091 "$f" || fail=1
          done < <(shell_files)
          exit $fail

      # Severity `error` alone missed SC2164 -- `cd` with no `|| exit` -- in
      # four scripts, one of them the local CI runner itself, where it would
      # have meant checking the wrong tree and calling it green. The excluded
      # codes are listed with their reasons in scripts/ci-local.sh.
      - name: ShellCheck warnings (live sources)
        run: |
          set -euo pipefail
          # Selected by SHEBANG, not by suffix: ten tracked shell programs have
          # no suffix at all -- the eight omarchy-arm-* commands that ship
          # inside the image, the update hook, and scripts/omssh -- so every
          # '*.sh' glob here skipped them. omssh had an unbalanced quote that
          # made it unparseable from the day it was written, through every
          # green run of this workflow.
          shell_files() {
            git ls-files | while IFS= read -r f; do
              case "$f" in *.sh) printf '%s\n' "$f"; continue ;; esac
              [ -f "$f" ] || continue
              head -1 "$f" 2>/dev/null | grep -qE '^#!.*[/ ](bash|sh)$' && printf '%s\n' "$f"
            done
          }
          fail=0
          while IFS= read -r f; do
            case "$f" in fixes/*|provision/repair-iso/*) continue ;; esac
            shellcheck -S warning -e SC1090,SC1091,SC2046,SC2024,SC2034 "$f" || fail=1
          done < <(shell_files)
          exit $fail
